name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifications:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier les scripts Bash
        run: shellcheck *.sh

      - name: Vérifier la syntaxe Python
        run: python3 -m py_compile disque.py

      - name: Construire l'image Docker
        run: docker build -t mon-site:test site
  publier-image:
    needs: verifications
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Se connecter au registre GitHub
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Construire et publier l'image
        run: |
          image="ghcr.io/1johnnyboy/mon-site"
          docker build -t "$image:${{ github.sha }}" -t "$image:latest" site
          docker push "$image:${{ github.sha }}"
          docker push "$image:latest"
